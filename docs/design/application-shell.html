<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Helios application shell</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1218;color:#e8eff6;font:14px/1.4 ui-sans-serif,system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:64px 240px 1fr 220px;grid-template-rows:54px 1fr 170px;background:#0f1821}.top{grid-column:1/5;padding:16px 22px;border-bottom:1px solid #2b3b4a;color:#82d6e8}.rail{grid-row:1/4;padding:18px 12px;background:#111b25;border-right:1px solid #2b3b4a;display:flex;flex-direction:column;gap:16px}.rail b{padding:10px;border-radius:12px;text-align:center;background:#245268}.panel{padding:20px;background:#172330;border-right:1px solid #2b3b4a}.tree div{padding:7px 0;color:#9fb0c0}.tree .active{color:#fff;background:#245268;border-radius:7px;padding-left:8px}.editor{padding:18px;background:linear-gradient(135deg,#111b25,#10161c)}.tabs{display:flex;gap:4px}.tab{padding:10px 14px;background:#1c2b38;border-radius:8px 8px 0 0}.tab.active{background:#263d4b;color:#9be9f7}.doc{height:calc(100% - 54px);padding:34px 8%;background:#101820;border:1px solid #263b4b}.line{height:12px;background:#315366;margin:13px 0;border-radius:4px}.line.short{width:38%}.outline{padding:20px;background:#172330}.outline p{color:#94a7b8}.bottom{grid-column:2/5;padding:18px;background:#131e28;border-top:1px solid #2b3b4a}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#234457;color:#8de5f3;margin-right:8px}
@media(max-width:850px){.shell{grid-template-columns:56px 1fr;grid-template-rows:54px 1fr 150px}.top{grid-column:1/3}.rail{grid-row:1/4}.panel,.outline{display:none}.bottom{grid-column:2}.editor{grid-column:2}}
</style></head><body><div class="shell"><div class="top">Helios <span style="color:#91a1b2">/ workspace: zith-editor</span></div><aside class="rail"><b>H</b><b>+</b><b>⌕</b><b>G</b><b>⚙</b></aside><aside class="panel"><strong>WORKSPACE</strong><div class="tree"><div>src</div><div class="active">main.zith</div><div>stdlib</div><div>tests</div><div>README.md</div></div></aside><main class="editor"><div class="tabs"><div class="tab active">main.zith</div><div class="tab">parser.zith</div></div><div class="doc"><div class="line short"></div><div class="line"></div><div class="line" style="width:72%"></div><div class="line short"></div><div class="line" style="width:61%"></div></div></main><aside class="outline"><strong>OUTLINE</strong><p>main</p><p>parseModule</p><p>emitDiagnostics</p></aside><section class="bottom"><span class="pill">2 diagnostics</span><span class="pill">LSP connected</span><span class="pill">VIM: INSERT</span><span style="float:right;color:#91a1b2">Ln 18, Col 4</span></section></div></body></html>
